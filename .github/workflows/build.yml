name: Build

on:
    workflow_dispatch:
    push:
        branches: [ main ]
        tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
    unit-tests:
        name: "Unit tests"
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run unit tests (windows)
                if: matrix.os == 'windows-latest'
                run: ./build.ps1 CodeCoverage
            -   name: Run unit tests (ubuntu|macos)
                if: matrix.os != 'windows-latest'
                run: ./build.sh CodeCoverage
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: ${{ runner.os }}-artifacts
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    api-tests:
        name: "API tests"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: API checks
                run: ./build.sh ApiChecks
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: API-tests
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    union-tests:
        name: "Union tests (net11.0, C# preview)"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Union tests
                run: ./build.sh UnionTests
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: Union-tests
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    benchmarks:
        name: "Benchmarks (${{ matrix.benchmark }})"
        strategy:
            fail-fast: false
            matrix:
                benchmark:
                    - CallbackBenchmarks
                    - CompleteEventBenchmarks
                    - CompleteIndexerBenchmarks
                    - CompleteMethodBenchmarks
                    - CompletePropertyBenchmarks
                    - MockCreationBenchmarks
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run benchmarks
                run: ./build.sh Benchmarks --benchmark-filter "*${{ matrix.benchmark }}*"
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: Benchmarks-${{ matrix.benchmark }}
                    path: |
                        ./Artifacts/*
                    if-no-files-found: ignore

    publish-benchmark-report:
        name: "Publish Benchmark Report"
        needs: [ benchmarks ]
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        10.0.x
                    global-json-file: global.json
            -   name: Publish benchmark report
                run: ./build.sh PublishBenchmarkReport
                env:
                    GithubToken: ${{ secrets.GITHUB_TOKEN }}
                    WorkflowRunId: ${{ github.run_id }}

    mutation-tests:
        name: "Mutation tests"
        runs-on: ubuntu-latest
        env:
            STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run mutation tests
                run: ./build.sh MutationTests MutationTestDashboard
    
    static-code-analysis:
        name: "Static code analysis"
        runs-on: ubuntu-latest
        env:
            REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run sonarcloud analysis
                run: ./build.sh CodeAnalysis
    
    publish-test-results:
        name: "Publish Tests Results"
        needs: [ api-tests, unit-tests, union-tests ]
        runs-on: ubuntu-latest
        permissions:
            checks: write
            pull-requests: write
        if: always()
        steps:
            -   name: Download Artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts
            -   name: Publish Test Results
                uses: EnricoMi/publish-unit-test-result-action@v2
                with:
                    comment_mode: always
                    files: "artifacts/**/**/*.trx"
    
    pack:
        name: "Pack"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Pack nuget packages
                run: ./build.sh Pack
            -   name: Upload packages
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    path: Artifacts/Packages
                    name: Packages
    
    push:
        name: "Push"
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        runs-on: macos-latest
        environment: production
        needs: [ publish-test-results, benchmarks, static-code-analysis, pack, mutation-tests ]
        permissions:
            contents: write
        steps:
            -   name: Download packages
                uses: actions/download-artifact@v8
                with:
                    name: Packages
                    path: Artifacts/Packages
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
            -   name: Publish
                run: |
                    echo "Found the following packages to push:"
                    search_dir=Artifacts/Packages
                    for entry in Artifacts/Packages/*.nupkg
                    do
                      echo "- $entry"
                    done
                    for entry in Artifacts/Packages/*.nupkg
                    do
                       dotnet nuget push $entry --source https://api.nuget.org/v3/index.json --api-key "${{secrets.NUGET_API_KEY}}" --skip-duplicate
                    done
            -   name: Check pre-release
                id: check-pre-release
                run: |
                    if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "release=true" >> $GITHUB_OUTPUT
                    fi
            -   name: Create GitHub release
                if: steps.check-pre-release.outputs.release == 'true'
                continue-on-error: true
                uses: softprops/action-gh-release@v3
                with:
                    name: ${{ steps.tag.outputs.release_version }}
                    tag_name: ${{ steps.tag.outputs.release_version }}
                    token: ${{ secrets.GITHUB_TOKEN }}
                    generate_release_notes: true
    
    finalize-release:
        name: "Finalize release"
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        needs: [ push ]
        permissions:
            contents: read
            issues: write
            pull-requests: write
        steps:
            -   name: Check pre-release
                id: check-pre-release
                run: |
                    if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "release=true" >> $GITHUB_OUTPUT
                    fi
            -   name: Comment relevant issues and pull requests
                if: steps.check-pre-release.outputs.release == 'true'
                continue-on-error: true
                uses: apexskier/github-release-commenter@v1.4.1
                with:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    comment-template: |
                        This is addressed in release {release_link}.
                    label-template: |
                        state: released
                    skip-label: |
                        state: released
