name: CI

on:
    workflow_dispatch:
    pull_request:
        branches: [ main ]

jobs:
    unit-tests:
        name: "Unit tests"
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run unit tests (windows)
                if: matrix.os == 'windows-latest'
                run: ./build.ps1 CodeCoverage
            -   name: Run unit tests (ubuntu|macos)
                if: matrix.os != 'windows-latest'
                run: ./build.sh CodeCoverage
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: ${{ runner.os }}-artifacts
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    api-tests:
        name: "API tests"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: API checks
                run: ./build.sh ApiChecks
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: API-tests
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    mutation-tests:
        name: "Mutation tests"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run mutation tests
                run: ./build.sh MutationTests
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: MutationTests
                    path: |
                        ./Artifacts/*
    
    union-tests:
        name: "Union tests (net11.0, C# preview)"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Union tests
                run: ./build.sh UnionTests
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: Union-tests
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    benchmarks:
        name: "Benchmarks (${{ matrix.benchmark }})"
        strategy:
            fail-fast: false
            matrix:
                benchmark:
                    - CallbackBenchmarks
                    - CompleteEventBenchmarks
                    - CompleteIndexerBenchmarks
                    - CompleteMethodBenchmarks
                    - CompletePropertyBenchmarks
                    - MockCreationBenchmarks
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run benchmarks
                run: ./build.sh Benchmarks --benchmark-filter "*${{ matrix.benchmark }}*"
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: Benchmarks-${{ matrix.benchmark }}
                    path: |
                        ./Artifacts/*
                    if-no-files-found: ignore
    
    static-code-analysis:
        name: "Static code analysis"
        if: ${{ github.actor != 'dependabot[bot]'&& github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        runs-on: ubuntu-latest
        env:
            REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x
                    global-json-file: global.json
            -   name: Run sonarcloud analysis
                run: ./build.sh CodeAnalysis
    
    publish-test-results:
        name: "Publish Tests Results"
        needs: [ api-tests, unit-tests, union-tests ]
        runs-on: ubuntu-latest
        permissions:
            checks: write
            pull-requests: write
        if: always()
        steps:
            -   name: Download Artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts
            -   name: Publish Test Results
                uses: EnricoMi/publish-unit-test-result-action@v2
                with:
                    comment_mode: always
                    files: "artifacts/**/**/*.trx"
