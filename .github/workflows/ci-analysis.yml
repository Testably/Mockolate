name: CI-Analysis

on:
    workflow_dispatch:
    workflow_run:
        workflows: [ "CI" ]
        types:
            - completed

jobs:
    mutation-tests:
        name: "Mutation tests"
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        10.0.x
                    global-json-file: global.json
            -   name: Create mutation test comment
                run: ./build.sh MutationTestComment
                env:
                    GithubToken: ${{ secrets.GITHUB_TOKEN }}
                    WorkflowRunId: ${{ github.event.workflow_run.id }}
    
    benchmarks:
        name: "Benchmarks"
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        10.0.x
                    global-json-file: global.json
            -   name: Create benchmark comment
                run: ./build.sh BenchmarkComment
                env:
                    GithubToken: ${{ secrets.GITHUB_TOKEN }}
                    WorkflowRunId: ${{ github.event.workflow_run.id }}
